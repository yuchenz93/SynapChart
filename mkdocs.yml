site_name: SynapChart
site_url: https://yuchenz93.github.io/SynapChart/
site_description: Visual pipeline builder for neuroscience data analysis
site_author: Yuchen Zhou
repo_url: https://github.com/yuchenz93/SynapChart
repo_name: yuchenz93/SynapChart

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yuchenz93/SynapChart

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorials:
      - Overview: tutorials/index.md
      - "Tutorial 1: Theta Phase Precession": tutorials/tutorial1.md
      - "Tutorial 2: Batch Processing with the Dataset Iterator": tutorials/tutorial2.md
      - "Tutorial 3: Theta Sequences with Real Hippocampal Data": tutorials/tutorial3.md
  - Block Reference:
      - Overview: blocks/index.md
      - NeuroData: neurodata.md
      - Data I/O: blocks/data-io.md
      - LFP / EEG: blocks/lfp-eeg.md
      - Spikes: blocks/spikes.md
      - Visualization: blocks/visualization.md
      - Custom Blocks: blocks/custom-blocks.md
  - Workflows:
      - Overview: workflows/index.md
      - Theta Phase Precession: workflows/theta-phase-precession.md
  - Advanced:
      - Composite Blocks: advanced/composite-blocks.md
      - Flow Control: advanced/flow-control.md
  - Changelog: changelog.md

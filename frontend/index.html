<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SynapChart</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #0f172a; color: #f9fafb; font-family: system-ui, sans-serif; }
      @keyframes nf-spin  { to { transform: rotate(360deg); } }
      @keyframes nf-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.6); } 60% { box-shadow: 0 0 0 5px rgba(59,130,246,0); } }
      @keyframes nf-jiggle {
        0%, 100% { transform: rotate(0deg); }
        20%       { transform: rotate(-2.5deg); }
        40%       { transform: rotate(2.5deg); }
        60%       { transform: rotate(-1.5deg); }
        80%       { transform: rotate(1.5deg); }
      }

      /* Custom edge paths: default gray, hover/selected indigo */
      .react-flow__edge-path { stroke: #4b5563; stroke-width: 1.5px; }
      .react-flow__edge:hover .react-flow__edge-path { stroke: #818cf8; cursor: pointer; }
      /* Widen the invisible hit area for edge clicking */
      .react-flow__edge-interaction { stroke-width: 12px; stroke: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
